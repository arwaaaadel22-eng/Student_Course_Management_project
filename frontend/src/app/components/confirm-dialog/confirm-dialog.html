<div
  class="confirm-backdrop"
  *ngIf="confirmService.state() as state"
  (click)="confirmService.respond(false)">
  <div
    class="confirm-dialog"
    role="alertdialog"
    aria-modal="true"
    (click)="$event.stopPropagation()">
    <p>{{ state.message }}</p>
    <div class="confirm-actions">
      <button type="button" class="secondary-button" (click)="confirmService.respond(false)">
        Cancel
      </button>
      <button type="button" class="danger-button" (click)="confirmService.respond(true)">
        {{ state.confirmLabel }}
      </button>
    </div>
  </div>
</div>
