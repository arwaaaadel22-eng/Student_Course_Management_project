<nav class="navbar">
  <div class="navbar-container">

    <!-- Brand -->
    <a class="brand" routerLink="/courses">
      <div class="brand-icon">▱</div>

      <div class="brand-text">
        <span class="brand-name">Northfield University</span>
        <span class="brand-subtitle">Course Enrollment</span>
      </div>
    </a>

    <!-- Navigation -->
    <div class="nav-links">

      <a
        routerLink="/courses"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        Courses
      </a>

      <a
        routerLink="/profile"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        Profile
      </a>

      <a
        *ngIf="user?.role === 'admin'"
        routerLink="/admin/courses"
        routerLinkActive="active">
        Manage courses
      </a>

      <a *ngIf="!user" routerLink="/login" routerLinkActive="active">Sign in</a>
      <a *ngIf="!user" routerLink="/register" routerLinkActive="active">Register</a>

    </div>

    <!-- User -->
    <div *ngIf="user" class="nav-user">

      <div class="avatar">
        {{ getInitials(user?.firstName || '', user?.lastName || '') }}
      </div>

      <span class="user-name">
        {{ user?.firstName }} {{ user?.lastName }}
      </span>

      <button
        class="sign-out"
        type="button"
        (click)="signOut()">
        Sign out
      </button>

    </div>

  </div>
</nav>
